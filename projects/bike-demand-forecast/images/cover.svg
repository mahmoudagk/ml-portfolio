<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Bike Demand Forecast</title>
  <desc id="desc">Vertical cover illustration for an hourly bike rental forecasting project, with a city bike, time-series accents, and held-out model metrics.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1427"/>
      <stop offset="0.55" stop-color="#10243a"/>
      <stop offset="1" stop-color="#123c4a"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ef3d1"/>
      <stop offset="1" stop-color="#16a6a5"/>
    </linearGradient>
    <linearGradient id="sunset" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffbf69"/>
      <stop offset="1" stop-color="#f07868"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#b8d8e4" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="900" height="1200" fill="url(#background)"/>
  <rect width="900" height="1200" fill="url(#grid)"/>
  <circle cx="770" cy="190" r="215" fill="#18b9ad" opacity=".08"/>
  <circle cx="110" cy="720" r="260" fill="#63e6be" opacity=".045"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="70" y="66" width="308" height="42" rx="21" fill="#16364a" stroke="#4ad2bb" stroke-opacity=".5"/>
    <circle cx="94" cy="87" r="6" fill="#63e6be"/>
    <text x="112" y="94" fill="#a9f4e2" font-size="15" font-weight="700" letter-spacing="2.2">TIME SERIES  /  REGRESSION</text>

    <text x="68" y="191" fill="#f6fbff" font-size="68" font-weight="700" letter-spacing="-2">Bike Demand</text>
    <text x="68" y="270" fill="#f6fbff" font-size="68" font-weight="700" letter-spacing="-2">Forecast</text>
    <rect x="71" y="301" width="84" height="6" rx="3" fill="url(#sunset)"/>
    <text x="70" y="346" fill="#b7c9d8" font-size="21" letter-spacing=".4">Hourly rental prediction from calendar</text>
    <text x="70" y="376" fill="#b7c9d8" font-size="21" letter-spacing=".4">and weather signals</text>

    <g opacity=".72" fill="none" stroke="url(#sunset)" stroke-width="3" stroke-dasharray="7 10">
      <path d="M75 452 C175 424 206 477 300 449 S465 421 546 451 S694 405 824 430"/>
    </g>
    <g fill="#ffc777">
      <circle cx="75" cy="452" r="5"/><circle cx="300" cy="449" r="5"/><circle cx="546" cy="451" r="5"/><circle cx="824" cy="430" r="5"/>
    </g>
    <g opacity=".6" fill="#57d9c0">
      <rect x="92" y="755" width="44" height="91" rx="4"/>
      <rect x="148" y="713" width="54" height="133" rx="4"/>
      <rect x="213" y="766" width="42" height="80" rx="4"/>
      <rect x="652" y="742" width="50" height="104" rx="4"/>
      <rect x="713" y="692" width="50" height="154" rx="4"/>
      <rect x="774" y="732" width="50" height="114" rx="4"/>
    </g>
    <path d="M0 846 Q100 816 208 846 T420 844 T650 846 T900 836 V900 H0Z" fill="#0a1b2c" opacity=".72"/>

    <!-- Clean line-art bike -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <g stroke="#9adfd8" stroke-opacity=".68" stroke-width="5">
        <circle cx="260" cy="650" r="139"/>
        <circle cx="640" cy="650" r="139"/>
        <path d="M260 511V789M121 650H399M640 511V789M501 650H779" stroke-opacity=".24" stroke-width="2"/>
        <path d="M260 650L358 505L439 650L260 650M358 505L561 505L640 650M561 505L576 585L439 650M439 650L260 650" stroke="url(#mint)" stroke-width="10"/>
        <circle cx="439" cy="650" r="22" stroke="#ffc777" stroke-width="6"/>
        <path d="M439 650L475 674M439 650L417 618M358 505L340 474M320 474H373M561 505L578 474M578 474H615M576 585L591 580" stroke="#e5f4f5" stroke-width="8"/>
        <path d="M540 489L565 489M602 463L623 474" stroke="#ffc777" stroke-width="7"/>
        <path d="M260 650L439 650" stroke="#ffc777" stroke-opacity=".7" stroke-width="3" stroke-dasharray="5 9"/>
      </g>
      <g fill="#0d2436" stroke="#63e6be" stroke-width="8">
        <circle cx="260" cy="650" r="9"/>
        <circle cx="640" cy="650" r="9"/>
      </g>
    </g>

    <g transform="translate(70 906)">
      <rect width="760" height="214" rx="24" fill="#0d1b2c" fill-opacity=".93" stroke="#5fe0c4" stroke-opacity=".38" stroke-width="2"/>
      <text x="32" y="43" fill="#a9f4e2" font-size="14" font-weight="700" letter-spacing="2.2">HELD-OUT TEST  ·  RANDOM FOREST</text>
      <line x1="32" y1="62" x2="728" y2="62" stroke="#486176" stroke-opacity=".65"/>
      <text x="34" y="125" fill="#f6fbff" font-size="43" font-weight="700">56.55</text>
      <text x="36" y="155" fill="#aabccc" font-size="16" letter-spacing="1">MAE · BIKES / HOUR</text>
      <line x1="380" y1="85" x2="380" y2="170" stroke="#486176" stroke-opacity=".65"/>
      <text x="416" y="125" fill="#f6fbff" font-size="43" font-weight="700">0.850</text>
      <text x="418" y="155" fill="#aabccc" font-size="16" letter-spacing="1">R-SQUARED</text>
      <text x="34" y="192" fill="#79dfce" font-size="14" letter-spacing="1.3">17,379 HOURLY ROWS   ·   7 MODELS   ·   CHRONOLOGICAL TEST</text>
    </g>
    <text x="70" y="1164" fill="#7f98ac" font-size="13" letter-spacing="2">MACHINE LEARNING PORTFOLIO</text>
    <text x="830" y="1164" fill="#7f98ac" font-size="13" text-anchor="end">2011—2012</text>
  </g>
</svg>
